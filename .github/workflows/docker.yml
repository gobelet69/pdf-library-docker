name: Verify and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t pdf-library-smoke .
      - name: Smoke test with a host PDF directory
        run: |
          mkdir -p "${RUNNER_TEMP}/pdf-library/sorted_pdfs/_Unsorted"
          docker run -d --name pdf-library-smoke -p 127.0.0.1:18765:8765 \
            -v "${RUNNER_TEMP}/pdf-library:/app/library" pdf-library-smoke
          trap 'docker rm -f pdf-library-smoke' EXIT
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/api/library || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          test "$status" = 401
          password=$(docker exec pdf-library-smoke cat /app/library/app_state/pdf_browser/admin_password)
          curl --fail --silent --show-error -u "admin:${password}" \
            http://127.0.0.1:18765/api/library > /dev/null

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: gobelet
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            gobelet/pdf-library:latest
            gobelet/pdf-library:${{ github.sha }}
